services:
  - type: web
    name: crm-management-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5

databases:
  - name: crm-management-db
    databaseName: crm_management
    user: crm_management
    plan: free
    region: singapore

services:
  - type: web
    name: crm-management-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM_EMAIL
        sync: false
      - key: FRONTEND_RESET_PASSWORD_URL
        value: https://i-one-crm-management-website.vercel.app/reset-password
